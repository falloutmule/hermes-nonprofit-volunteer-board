<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer Calendar — Hermes Non-Profit</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main>
    <p><a href="/">← Hermes Non-Profit</a></p>
    <p class="eyebrow">Volunteer calendar</p>
    <h1>Upcoming events</h1>
    <p class="muted">No account is required. Published events appear here when organizers add them.</p>
    <section id="events" aria-live="polite"><p>Loading events…</p></section>
  </main>
  <script>
    const root = document.querySelector('#events');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    fetch('/api/public/events')
      .then((response) => response.ok ? response.json() : Promise.reject(new Error('request failed')))
      .then(({events}) => {
        if (!events.length) {
          root.innerHTML = '<p class="card">No published volunteer events yet.</p>';
          return;
        }
        root.innerHTML = events.map((event) => `<article class="card">
          <h2>${escapeHtml(event.name)}</h2>
          <p><strong>${escapeHtml(new Date(event.startsAt).toLocaleString([], {timeZone: event.timezone || 'America/Denver', timeZoneName: 'short'}))}${event.endsAt ? ' – ' + escapeHtml(new Date(event.endsAt).toLocaleTimeString([], {timeZone: event.timezone || 'America/Denver', hour:'numeric',minute:'2-digit',timeZoneName:'short'})) : ''}</strong></p>
          <p>${escapeHtml(event.location || 'Location to be announced')}</p>
          ${event.staffingEnabled ? (event.categories?.length ? `
          <h3>Volunteer opportunities</h3>
          ${event.categories.filter(category => category.active).sort((a,b) => a.sortOrder-b.sortOrder).map(category => `<section>
            <p><strong>${escapeHtml(category.name)}</strong> — ${category.spotsAvailable > 0 ? `${category.spotsAvailable} spots` : 'Full'}${category.reservedCount ? ` · ${category.reservedCount} reserved` : ''}</p>
            ${category.signupEligible ? `<a class="button" href="sms:+19704708839?body=${encodeURIComponent(category.key)}">Text ${escapeHtml(category.key)}${category.spotsAvailable ? ' to volunteer' : ' for standby'}</a>` : '<p>Signup is closed.</p>'}
          </section>`).join('')}
          <p>New to volunteer SMS? Text JOIN first. Then choose a category and Saturday.</p>` : `<p>${event.spotsAvailable} of ${event.capacity} spots currently available</p>
          <a class="button" href="sms:+19704708839?body=${encodeURIComponent(event.slug)}">Text ${escapeHtml(event.slug)} to volunteer</a>`) : '<p>No volunteer signup required.</p>'}
        </article>`).join('');
      })
      .catch(() => { root.innerHTML = '<p class="card">The event list is temporarily unavailable.</p>'; });
  </script>
</body>
</html>
